<!DOCTYPE html>
<html>
<head>
    <title>Apicus ROI Checker Options</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Apicus ROI Checker Options</h1>

    <div>
        <label for="apiKey">OpenAI API Key:</label>
        <input type="password" id="apiKey" name="apiKey">
    </div>

    <button id="saveButton">Save Key</button>
    <div id="status"></div>

    <script src="options.js"></script>
</body>
</html>
